name: Build WOW OS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build release APK
        run: gradle assembleRelease --no-daemon
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk WOWOS.apk
      - name: Write version.json
        run: |
          VC=$(grep versionCode app/build.gradle | grep -o '[0-9]\+' | head -1)
          VN=$(grep versionName app/build.gradle | grep -o "'[^']*'" | tr -d "'" | head -1)
          printf '{"versionCode":%s,"versionName":"%s"}\n' "$VC" "$VN" > version.json
          cat version.json
      - uses: actions/upload-artifact@v4
        with:
          name: WOWOS-apk
          path: WOWOS.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: WOW OS build ${{ github.run_number }}
          body: Built from ${{ github.sha }}
          files: |
            WOWOS.apk
            version.json
          make_latest: true
