plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wowsir.wowos'
    compileSdk 34

    defaultConfig {
        applicationId 'com.wowsir.wowos'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '1.3'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            // Signed with the debug key so it installs straight over ADB.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
