plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wowsir.wowos'
    compileSdk 34

    defaultConfig {
        applicationId 'com.wowsir.wowos'
        minSdk 24
        targetSdk 34
        versionCode 30
        versionName '3.9'
    }

    signingConfigs {
        // A stable, committed key so every build is signed identically. Without this
        // the CI debug keystore is regenerated each run, the signature changes, and
        // Android refuses to update the installed app (forcing an uninstall, and
        // making /system swaps silently revert). Self-signed; fine for a personal box.
        release {
            storeFile file('wowos-release.jks')
            storePassword 'wowoswow'
            keyAlias 'wowos'
            keyPassword 'wowoswow'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
